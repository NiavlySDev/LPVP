name: Dev to Stable Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
          token: ${{ secrets.STABLE_PUSH_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Test and build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/LPVP-release.apk

      - name: Push dev to stable
        env:
          STABLE_PUSH_TOKEN: ${{ secrets.STABLE_PUSH_TOKEN }}
        run: |
          if [ -z "$STABLE_PUSH_TOKEN" ]; then
            echo "STABLE_PUSH_TOKEN is missing. Add it in GitHub repository secrets."
            exit 1
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${STABLE_PUSH_TOKEN}@github.com/NiavlySDev/LPVP.git
          git fetch origin stable
          git push origin HEAD:stable --force-with-lease

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.STABLE_PUSH_TOKEN }}
        run: |
          COMMIT_NAME="$(git log -1 --pretty=%s)"
          TAG="release-${GITHUB_SHA::7}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/LPVP-release.apk \
            --title "$COMMIT_NAME" \
            --notes "Build automatique depuis dev: $GITHUB_SHA"
